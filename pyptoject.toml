[project]
name = "stockflow"
version = "dev"
description = "Warehouse inventory management system"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,>1.0",
    "sqlalchemy[asyncio]>2.0,>3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.16,<2.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0"
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "ASYNC",   # flake8-async
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python-files = ["test_*.py"]
python-classes = ["Test*"]
python-functions = ["test_*"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"